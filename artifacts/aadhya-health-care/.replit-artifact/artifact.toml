kind = "web"
previewPath = "/"
title = "Aadhya Health Care"
description = "A polished hospital website for Aadhya Health Care with trusted care information, services, doctors, emergency contact actions, and a streamlined appointment booking experience."
version = "1.0.0"
id = "artifacts/aadhya-health-care"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23350

[services.development]
run = "pnpm --filter @workspace/aadhya-health-care run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aadhya-health-care", "run", "build" ]
serve = "static"
publicDir = "artifacts/aadhya-health-care/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23350"
BASE_PATH = "/"
